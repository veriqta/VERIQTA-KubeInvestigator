[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "veriqta-kubeinvestigator"
version = "0.1.0"
description = "Read-only, evidence-led Kubernetes investigations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fastapi", "uvicorn", "kubernetes", "httpx"]
[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pyyaml", "build", "pip-tools"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
kubeinvestigator = ["static/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
