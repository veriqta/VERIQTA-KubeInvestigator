apiVersion: v1
kind: Namespace
metadata:
  name: veriqta-demo
  labels: {app.kubernetes.io/part-of: kubeinvestigator-demo}
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-crash
  namespace: veriqta-demo
  labels: {app: checkout}
spec:
  containers:
    - name: app
      image: busybox:1.37.0
      command: [sh, -c, "echo 'Required application configuration is missing'; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: catalog-image
  namespace: veriqta-demo
  labels: {app: catalog}
spec:
  containers:
    - name: app
      image: busybox:veriqta-intentionally-missing
      command: [sh, -c, "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: veriqta-demo
  labels: {app: frontend}
spec:
  containers:
    - name: app
      image: nginx:1.28-alpine
      ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: veriqta-demo
spec:
  selector: {app: frontned}
  ports: [{port: 80, targetPort: 80}]
