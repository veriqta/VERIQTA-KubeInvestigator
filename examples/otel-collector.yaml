# Config for a separately installed OpenTelemetry Collector Contrib instance.
# Mount the team token at /run/secrets/investigator-token; do not inline it.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: kubeinvestigator
          scrape_interval: 30s
          authorization:
            credentials_file: /run/secrets/investigator-token
          static_configs:
            - targets: [investigator.veriqta-system.svc:8080]
exporters:
  otlp:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
processors:
  batch: {}
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlp]
