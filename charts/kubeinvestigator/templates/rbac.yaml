apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
---
{{- $root := . }}
{{- range .Values.namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $root.Release.Name }}-reader
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [pods, events, services]
    verbs: [get, list]
  {{- if $root.Values.logs }}
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  {{- end }}
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $root.Release.Name }}-reader
  namespace: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ $root.Values.serviceAccountName }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $root.Release.Name }}-reader
---
{{- end }}
