name: Prepare release artifacts (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    name: Candidate / ${{ matrix.architecture }} / no publication
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Select maintained Python with verified patched SQLite
        run: bash scripts/setup-ci-python.sh
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with: {version: v3.19.0}
      - run: make setup test check
      - name: Source security gate and pinned scanner installation
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          cache-dir: ${{ runner.temp }}/source-trivy
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Build and verify native versioned candidate with ephemeral test identity
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          umask 077
          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Native runner architecture mismatch" >&2; exit 1 ;;
          esac
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/candidate-signing.pem"
          .venv/bin/python scripts/release_bundle.py --prepare \
            --signing-key "$RUNNER_TEMP/candidate-signing.pem"
          rm -f "$RUNNER_TEMP/candidate-signing.pem"
      - name: Retain candidate artifacts only (not a release or registry publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-0.1.0-${{ matrix.architecture }}
          path: dist/
          retention-days: 7
      - name: Remove ephemeral test key after interruption
        if: always()
        run: rm -f "$RUNNER_TEMP/candidate-signing.pem"
