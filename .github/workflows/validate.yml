name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Select maintained Python with verified patched SQLite
        run: bash scripts/setup-ci-python.sh
      - run: make setup
      - run: make test check
      - run: .venv/bin/python scripts/check_sqlite_update.py
      - run: .venv/bin/pip install pip-audit pip-licenses
      - run: .venv/bin/pip-audit -r requirements.lock
      - run: .venv/bin/pip-licenses --format=json --output-file=/tmp/dependency-licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: dependency-licenses, path: /tmp/dependency-licenses.json}
      - run: .venv/bin/python scripts/check_licenses.py /tmp/dependency-licenses.json
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with: {version: v3.19.0}
      - run: python -m venv /tmp/chart-check && /tmp/chart-check/bin/pip install PyYAML==6.0.3
      - run: helm lint charts/kubeinvestigator -f examples/values.yaml
      - run: |
          for version in 1.35.0 1.36.0 1.37.0; do
            helm template investigator charts/kubeinvestigator -n veriqta-system -f examples/values.yaml --kube-version "$version" > /tmp/rendered.yaml
            /tmp/chart-check/bin/python scripts/check_chart.py /tmp/rendered.yaml
          done
  container:
    name: Container / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Verify native architecture and build final runtime
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          machine_arch=$(uname -m)
          case "$EXPECTED_ARCH:$machine_arch" in
            amd64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "Unexpected host architecture: $machine_arch" >&2; exit 1 ;;
          esac
          actual_arch=$(docker info --format '{{.Architecture}}')
          case "$EXPECTED_ARCH:$actual_arch" in
            amd64:amd64|amd64:x86_64|arm64:arm64|arm64:aarch64) ;;
            *) echo "Unexpected Docker architecture: $actual_arch" >&2; exit 1 ;;
          esac
          docker build --target runtime -t kubeinvestigator:ci .
          docker image inspect kubeinvestigator:ci > "$RUNNER_TEMP/image-inspect.json"
          docker run --rm -i --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            kubeinvestigator:ci python - < scripts/check_runtime.py > "$RUNNER_TEMP/runtime-check.json"
          docker save --output "$RUNNER_TEMP/investigator.tar" kubeinvestigator:ci
      - name: Scan exact Docker archive and retain complete findings locally
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          input: ${{ runner.temp }}/investigator.tar
          scanners: vuln,secret
          list-all-pkgs: 'true'
          format: json
          output: ${{ runner.temp }}/image-scan.json
          cache-dir: ${{ runner.temp }}/trivy-cache
          exit-code: '0'
      - name: Record image lineage and sanitised scan evidence
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          trivy --version > "$RUNNER_TEMP/scanner-version.txt"
          python3 scripts/record_image_scan.py \
            --archive "$RUNNER_TEMP/investigator.tar" \
            --inspect "$RUNNER_TEMP/image-inspect.json" \
            --scan "$RUNNER_TEMP/image-scan.json" \
            --runtime-check "$RUNNER_TEMP/runtime-check.json" \
            --database "$RUNNER_TEMP/trivy-cache/db/metadata.json" \
            --scanner-info "$RUNNER_TEMP/scanner-version.txt" \
            --architecture "$EXPECTED_ARCH" \
            --output "$RUNNER_TEMP/image-security.json"
      - name: Enforce unchanged HIGH/CRITICAL and secret gate
        run: |
          trivy --cache-dir "$RUNNER_TEMP/trivy-cache" image --skip-db-update \
            --input "$RUNNER_TEMP/investigator.tar" --scanners vuln,secret \
            --severity HIGH,CRITICAL --exit-code 1
      - name: Retain sanitised final-image evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image-security.json
          if-no-files-found: warn
          retention-days: 7
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Build final runtime, including verified SQLite source package
        run: docker build --target runtime -t kubeinvestigator:runtime-check .
      - name: Check installed runtime independently of scanner advisory coverage
        run: |
          docker run --rm -i --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            kubeinvestigator:runtime-check python - < scripts/check_runtime.py
  smoke:
    uses: ./.github/workflows/cluster-smoke.yml
  secrets:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
