<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><rect width="1200" height="250" fill="#fafcf8"/><text x="25" y="51" font-family="sans-serif" font-size="24" fill="#124c38">An investigation is a bounded snapshot</text><rect x="25" y="104" width="202" height="68" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="126" y="143" text-anchor="middle" fill="#124c38" font-size="16" font-family="sans-serif">Queued</text><path d="M230 138h24m-7-5l7 5-7 5" fill="none" stroke="#4f7a61" stroke-width="2"/><rect x="260" y="104" width="202" height="68" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="361" y="143" text-anchor="middle" fill="#124c38" font-size="16" font-family="sans-serif">Running</text><path d="M465 138h24m-7-5l7 5-7 5" fill="none" stroke="#4f7a61" stroke-width="2"/><rect x="495" y="104" width="202" height="68" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="596" y="143" text-anchor="middle" fill="#124c38" font-size="16" font-family="sans-serif">Collect evidence</text><path d="M700 138h24m-7-5l7 5-7 5" fill="none" stroke="#4f7a61" stroke-width="2"/><rect x="730" y="104" width="202" height="68" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="831" y="143" text-anchor="middle" fill="#124c38" font-size="16" font-family="sans-serif">Validate finding</text><path d="M935 138h24m-7-5l7 5-7 5" fill="none" stroke="#4f7a61" stroke-width="2"/><rect x="965" y="104" width="202" height="68" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="1066" y="143" text-anchor="middle" fill="#124c38" font-size="16" font-family="sans-serif">Terminal report</text><text x="25" y="215" font-family="sans-serif" font-size="15" fill="#526b59">Completed, insufficient evidence, failed or cancelled. Restart recovers active records as interrupted.</text></svg>