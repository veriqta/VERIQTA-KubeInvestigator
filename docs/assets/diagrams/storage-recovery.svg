<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" fill="#fafcf8"/><text x="20" y="48" font-size="25" font-family="sans-serif" fill="#124c38">Offline recovery: explicit operator action, no workload remediation</text><rect x="20" y="100" width="365" height="70" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="202" y="142" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#124c38">1. Stop application</text><path d="M388 135h21m-6-5l6 5-6 5" fill="none" stroke="#56765e" stroke-width="2"/><rect x="415" y="100" width="365" height="70" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="597" y="142" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#124c38">2. Acquire writer lease</text><path d="M783 135h21m-6-5l6 5-6 5" fill="none" stroke="#56765e" stroke-width="2"/><rect x="810" y="100" width="365" height="70" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="992" y="142" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#124c38">3. Validate backup</text><rect x="20" y="230" width="365" height="70" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="202" y="272" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#124c38">4. Preserve old target</text><path d="M388 265h21m-6-5l6 5-6 5" fill="none" stroke="#56765e" stroke-width="2"/><rect x="415" y="230" width="365" height="70" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="597" y="272" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#124c38">5. Replace atomically</text><path d="M783 265h21m-6-5l6 5-6 5" fill="none" stroke="#56765e" stroke-width="2"/><rect x="810" y="230" width="365" height="70" rx="8" fill="#edf4ec" stroke="#b0cbb8"/><text x="992" y="272" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#124c38">6. Start matching binary</text><path d="M992 173v35H202v20" fill="none" stroke="#56765e" stroke-width="2"/><text x="20" y="360" font-family="sans-serif" font-size="15" fill="#526b59">Helm revision rollback was tested with schema 1. Cross-version schema downgrade requires a matching backup and binary.</text></svg>